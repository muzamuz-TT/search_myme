<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            font-family: monospace;
            background-color: #121212;
            color: #ff5555;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { font-size: 5rem; margin: 0; }
        p { font-size: 1.2rem; color: #aaa; text-align: center; padding: 0 20px; }

        /* Tombol tambah pin (+) di pojok kanan bawah */
        .add-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background-color: #ff5555;
            color: white;
            font-size: 32px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 85, 85, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .add-btn:hover {
            transform: scale(1.1);
        }

        /* Modal / Popup Form */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            color: white;
            width: 300px;
            border: 1px solid #333;
        }
        .modal h3 { margin-top: 0; color: #ff5555; }
        .modal input {
            display: block;
            margin: 12px 0;
            padding: 10px;
            width: 90%;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }
        .modal button {
            background: #ff5555;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }
        .modal button.secondary {
            background: #444;
        }
    </style>
</head>
<body>

    <h1>404</h1>
    <p id="errorDescription">Page Not Found</p>

    <!-- Tombol Tambah Pin -->
    <button class="add-btn" onclick="openModal()" title="Tambah Search Engine">+</button>

    <!-- Popup Modal -->
    <div id="pinModal" class="modal">
        <h3>Tambah Pin Search Engine</h3>
        <input type="text" id="prefixInput" placeholder="Shortcut (misal: @tt)">
        <input type="text" id="domainInput" placeholder="Domain (misal: tiktok.com)">
        <div class="modal-buttons">
            <button class="secondary" onclick="closeModal()">Batal</button>
            <button onclick="saveNewPin()">Simpan</button>
        </div>
    </div>

    <!-- Hubungkan script JavaScript -->
    <script src="pin.js"></script>
    <script src="404.js"></script>
</body>
</html>
